[package]
name = "wealthnest"
version = "0.1.0"
description = "WealthNest — Institutional-Grade Personal Wealth & Asset Operating System"
authors = ["Ketan Vaghela <ketan@wealthnest.local>"]
edition = "2021"

[lib]
name = "wealthnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
