name: Supabase — Automated Database & Edge Function Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Deploy SQL Migrations & Edge Functions to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Supabase Deployment Secrets
        id: check_secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing required repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, and SUPABASE_DB_PASSWORD must all be configured."
              exit 1
            fi
            echo "::notice::Skipping Supabase migration & Edge Function deploy because required SUPABASE_* repository secrets are not configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Setup Supabase CLI
        if: steps.check_secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Project & Push Migrations
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push --remote --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Sync Edge Function CORS Secrets
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          if [ -n "${ALLOWED_ORIGINS:-}" ]; then
            supabase secrets set "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" --remote="${{ secrets.SUPABASE_PROJECT_ID }}" --yes
          else
            echo "::notice::Repository secret ALLOWED_ORIGINS is not set; admin-create-user will allow wildcard (*) CORS until ALLOWED_ORIGINS is configured."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

      - name: Deploy Edge Functions
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          supabase functions deploy admin-create-user --remote="${{ secrets.SUPABASE_PROJECT_ID }}" --use-api --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
