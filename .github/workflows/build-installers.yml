name: WealthNest — Build Windows (.exe) & Android (.apk)

on:
  # Trigger manually from GitHub -> Actions -> "Run workflow" button
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version label (e.g., v0.1.0-offline)'
        required: false
        default: 'v0.1.0-offline'
  # Automatically build & publish a GitHub Release whenever a version tag is pushed (e.g., git tag v0.1.0 && git push --tags)
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: Quality Gate (TypeScript Strict Check + 335 Unit/Integration Tests)
  # ============================================================================
  verify-quality:
    name: 1. Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Includes Built-in node:sqlite DatabaseSync)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run TypeScript Project References Build (tsc -b)
        run: npm run type-check

      - name: Run Vitest Suite
        run: npm test -- --run

  # ============================================================================
  # JOB 2: Windows Desktop Installer (.exe & .msi)
  # ============================================================================
  build-windows-exe:
    name: 2. Build Windows Desktop (.exe / .msi)
    needs: verify-quality
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Includes Built-in node:sqlite DatabaseSync)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Monorepo Dependencies & Tauri 2 CLI
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@^2

      - name: Build Shared & Domain Packages
        run: npm run type-check

      - name: Build Windows Tauri Desktop (.exe NSIS & .msi)
        run: npx tauri build

      - name: Upload Windows Installer (.exe & .msi) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WealthNest-Windows-Desktop-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/wealthnest.exe
          retention-days: 30

  # ============================================================================
  # JOB 3: Android Mobile Signed Package (.apk & .aab)
  # ============================================================================
  build-android-apk:
    name: 3. Build Android Signed (.apk / .aab)
    needs: verify-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Includes Built-in node:sqlite DatabaseSync)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Native Ubuntu Runner Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          # Locate sdkmanager on GitHub ubuntu-latest runner
          SDKMANAGER_BIN="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER_BIN"

          yes | "$SDKMANAGER_BIN" --licenses > /dev/null || true
          "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"

          echo "NDK_HOME=$SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Setup Rust Toolchain with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Monorepo Dependencies & Tauri 2 CLI
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@^2

      - name: Build Shared & Domain Packages
        run: npm run type-check

      - name: Build & Sign Android APK via scripts/build-android.sh
        run: bash ./scripts/build-android.sh local

      - name: Upload Signed Android (.apk & .aab) Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WealthNest-Android-Signed-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/wealthnest-offline-signed.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          retention-days: 30

  # ============================================================================
  # JOB 4: Publish GitHub Release (Runs automatically when pushing a v* tag)
  # ============================================================================
  publish-github-release:
    name: 4. Publish GitHub Release (.exe + .apk)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: WealthNest-Windows-Desktop-Installer
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: WealthNest-Android-Signed-APK
          path: release-assets/android

      - name: Create GitHub Release with .exe & .apk Installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.msi
            release-assets/android/**/wealthnest-offline-signed.apk
            release-assets/android/**/*.aab

