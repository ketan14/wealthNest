# WealthNest Local Supabase Configuration
project_id = "wealthnest"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54325

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
site_url = "http://wealthnest.local"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password", "http://wealthnest.local", "http://wealthnest.local/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

# Function-level JWT verification is enforced cryptographically inside index.ts via supabaseAdmin.auth.getUser(jwt)
# so ES256 tokens and sb_publishable_ keys are not prematurely rejected at the Edge Gateway.
[functions.admin-create-user]
verify_jwt = false
