name: wealthnest

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: wealthnest-web-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_HMR_CLIENT_PORT=${PROXY_PORT:-30000}
    volumes:
      # Mount monorepo root for real-time WSL hot module replacement
      - ../..:/app
      # Anonymous volumes to keep Linux container node_modules isolated
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/domain/node_modules
      - /app/packages/application/node_modules
    networks:
      - wealthnest-net
    # Port 5173 is reached via the Nginx proxy on port 30000 inside wealthnest-net
    # Avoid binding host 5174 to prevent collisions with Windows netsh or local Vite

  proxy:
    image: nginx:1.27-alpine
    container_name: wealthnest-proxy
    restart: unless-stopped
    ports:
      # Bind local port to serve WealthNest web application
      - "${PROXY_PORT:-30000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - wealthnest-net

networks:
  wealthnest-net:
    name: wealthnest-net
    driver: bridge
