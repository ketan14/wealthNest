name: wealthnest

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: wealthnest-web-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_HMR_CLIENT_PORT=80
    volumes:
      # Mount monorepo root for real-time WSL hot module replacement
      - ../..:/app
      # Anonymous volumes to keep Linux container node_modules isolated
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/domain/node_modules
      - /app/packages/application/node_modules
    networks:
      - wealthnest-net
    ports:
      # Direct port exposure for optional fallback access
      - "127.0.0.1:5173:5173"

  proxy:
    image: nginx:1.27-alpine
    container_name: wealthnest-proxy
    restart: unless-stopped
    ports:
      # Bind local port 80 to serve http://wealthnest.local
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - wealthnest-net

networks:
  wealthnest-net:
    name: wealthnest-net
    driver: bridge
